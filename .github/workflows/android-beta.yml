name: Build King Zulu Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle and validate complete public-domain KJV Bible
        run: |
          mkdir -p app/src/main/assets/bibles
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json \
            -o app/src/main/assets/bibles/kjv.json
          test -s app/src/main/assets/bibles/kjv.json
          python3 - <<'PY'
          import json
          p='app/src/main/assets/bibles/kjv.json'
          d=json.load(open(p,encoding='utf-8'))
          if len(d.get('books',[])) != 66: raise SystemExit('KJV validation failed')
          chapters=sum(len(b.get('chapters',[])) for b in d['books'])
          verses=sum(len(c.get('verses',[])) for b in d['books'] for c in b.get('chapters',[]))
          if chapters != 1189 or verses != 31102: raise SystemExit(f'KJV validation failed: {chapters} chapters, {verses} verses')
          print(f'KJV VERIFIED: 66 books, {chapters} chapters, {verses} verses')
          PY
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify YouVersion credential is configured
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: |
          if [ -z "$YOUVERSION_APP_KEY" ]; then
            echo "YOUVERSION_APP_KEY GitHub Actions secret is missing. NIV/online translations cannot be built."
            exit 1
          fi
      - name: Build debug APK with YouVersion support
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: gradle --no-daemon :app:assembleDebug --stacktrace -PYOUVERSION_APP_KEY="$YOUVERSION_APP_KEY"
      - name: Rename Beta APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KingZulu-Beta1.apk
      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KingZulu-Beta1
          path: KingZulu-Beta1.apk
          if-no-files-found: error
