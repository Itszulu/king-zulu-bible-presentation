name: Build King Zulu Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Hosted runners already carry Android SDK packages. Do not call sdkmanager
      # on every build: remote repository metadata failures were blocking the app
      # before Gradle could compile a single source file.
      - name: Verify required Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          if [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "Android 36 platform + build-tools 35.0.0 ready"
          else
            echo "Installed build tools:"
            ls -1 "$ANDROID_HOME/build-tools"
            test -n "$(ls -A "$ANDROID_HOME/build-tools")"
          fi

      - name: Bundle and validate complete public-domain KJV Bible
        run: |
          mkdir -p app/src/main/assets/bibles
          curl --fail --location --retry 3 --retry-all-errors \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json \
            -o app/src/main/assets/bibles/kjv.json
          test -s app/src/main/assets/bibles/kjv.json
          python3 - <<'PY'
          import json
          p='app/src/main/assets/bibles/kjv.json'
          with open(p, encoding='utf-8') as f:
              d=json.load(f)
          if len(d.get('books',[])) != 66:
              raise SystemExit('KJV validation failed: expected 66 books')
          chapters=sum(len(b.get('chapters',[])) for b in d['books'])
          verses=sum(len(c.get('verses',[])) for b in d['books'] for c in b.get('chapters',[]))
          if chapters != 1189 or verses != 31102:
              raise SystemExit(f'KJV validation failed: {chapters} chapters, {verses} verses')
          print(f'KJV VERIFIED: 66 books, {chapters} chapters, {verses} verses')
          PY

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Report optional provider configuration
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
        run: |
          if [ -n "$YOUVERSION_APP_KEY" ]; then
            echo "YouVersion provider: configured"
          else
            echo "YouVersion provider: not configured; building offline-first app without it"
          fi

      - name: Require permanent King Zulu signing identity
        env:
          KZ_KEYSTORE_B64: ${{ secrets.KINGZULU_KEYSTORE_B64 }}
          KZ_STORE_PASSWORD: ${{ secrets.KINGZULU_KEYSTORE_PASSWORD }}
          KZ_KEY_ALIAS: ${{ secrets.KINGZULU_KEY_ALIAS }}
          KZ_KEY_PASSWORD: ${{ secrets.KINGZULU_KEY_PASSWORD }}
        run: |
          test -n "$KZ_KEYSTORE_B64" || { echo "::error::KINGZULU_KEYSTORE_B64 is not configured"; exit 1; }
          test -n "$KZ_STORE_PASSWORD" || { echo "::error::KINGZULU_KEYSTORE_PASSWORD is not configured"; exit 1; }
          test -n "$KZ_KEY_ALIAS" || { echo "::error::KINGZULU_KEY_ALIAS is not configured"; exit 1; }
          test -n "$KZ_KEY_PASSWORD" || { echo "::error::KINGZULU_KEY_PASSWORD is not configured"; exit 1; }
          echo "$KZ_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/kingzulu-release.jks"

      - name: Compile, lint and unit test
        env:
          YOUVERSION_APP_KEY: ${{ secrets.YOUVERSION_APP_KEY }}
          KINGZULU_KEYSTORE_PATH: ${{ runner.temp }}/kingzulu-release.jks
          KINGZULU_KEYSTORE_PASSWORD: ${{ secrets.KINGZULU_KEYSTORE_PASSWORD }}
          KINGZULU_KEY_ALIAS: ${{ secrets.KINGZULU_KEY_ALIAS }}
          KINGZULU_KEY_PASSWORD: ${{ secrets.KINGZULU_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace -PYOUVERSION_APP_KEY="$YOUVERSION_APP_KEY"

      - name: Verify release APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | grep -Eq "(Signer #1|V2 Signer): certificate SHA-256 digest:"

      - name: Rename Beta APK
        run: cp app/build/outputs/apk/release/app-release.apk KingZulu-Beta1.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KingZulu-Beta1
          path: KingZulu-Beta1.apk
          if-no-files-found: error
