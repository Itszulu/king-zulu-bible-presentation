name: Build King Zulu Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle and validate complete public-domain KJV Bible
        run: |
          mkdir -p app/src/main/assets/bibles
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json \
            -o app/src/main/assets/bibles/kjv.json
          test -s app/src/main/assets/bibles/kjv.json
          python3 - <<'PY'
          import json, sys
          p='app/src/main/assets/bibles/kjv.json'
          d=json.load(open(p,encoding='utf-8'))
          # Accept the source's supported JSON shapes, but refuse to build if canonical coverage is missing.
          text=json.dumps(d).lower()
          required=['genesis','exodus','psalm','isaiah','matthew','john','romans','revelation']
          missing=[b for b in required if b not in text]
          if missing:
              raise SystemExit('KJV validation failed; missing books: '+', '.join(missing))
          print('KJV asset bytes:', len(open(p,'rb').read()))
          print('KJV canonical spot-check passed')
          PY
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename Beta APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KingZulu-Beta1.apk
      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KingZulu-Beta1
          path: KingZulu-Beta1.apk
          if-no-files-found: error
