name: Build King Zulu Beta APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install required Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - name: Bundle and validate complete public-domain KJV Bible
        run: |
          mkdir -p app/src/main/assets/bibles
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/midvash/bible-data/main/versions/en/kjv/kjv.json \
            -o app/src/main/assets/bibles/kjv.json
          test -s app/src/main/assets/bibles/kjv.json
          python3 - <<'PY'
          import json
          p='app/src/main/assets/bibles/kjv.json'
          d=json.load(open(p,encoding='utf-8'))
          expected=['Genesis','Exodus','Leviticus','Numbers','Deuteronomy','Joshua','Judges','Ruth','1 Samuel','2 Samuel','1 Kings','2 Kings','1 Chronicles','2 Chronicles','Ezra','Nehemiah','Esther','Job','Psalms','Proverbs','Ecclesiastes','Song of Solomon','Isaiah','Jeremiah','Lamentations','Ezekiel','Daniel','Hosea','Joel','Amos','Obadiah','Jonah','Micah','Nahum','Habakkuk','Zephaniah','Haggai','Zechariah','Malachi','Matthew','Mark','Luke','John','Acts','Romans','1 Corinthians','2 Corinthians','Galatians','Ephesians','Philippians','Colossians','1 Thessalonians','2 Thessalonians','1 Timothy','2 Timothy','Titus','Philemon','Hebrews','James','1 Peter','2 Peter','1 John','2 John','3 John','Jude','Revelation']
          books=d.get('books',[])
          names=[b.get('englishName') for b in books]
          missing=[b for b in expected if b not in names]
          extras=[b for b in names if b not in expected]
          chapters=sum(len(b.get('chapters',[])) for b in books)
          verses=sum(len(c.get('verses',[])) for b in books for c in b.get('chapters',[]))
          if len(books)!=66 or missing or extras:
              raise SystemExit(f'KJV book validation failed: count={len(books)} missing={missing} extras={extras}')
          if chapters!=1189:
              raise SystemExit(f'KJV chapter validation failed: expected 1189, got {chapters}')
          if verses!=31102:
              raise SystemExit(f'KJV verse validation failed: expected 31102, got {verses}')
          # Explicit regression checks for books/verses reported missing during device testing.
          lookup={b['englishName']:b for b in books}
          def verse(book,chapter,number):
              bk=lookup[book]
              ch=next((c for c in bk['chapters'] if c.get('chapter')==chapter),None)
              if not ch: return None
              return next((v for v in ch['verses'] if v.get('number')==number),None)
          for ref in [('Jeremiah',29,11),('John',5,24),('Romans',8,28),('Revelation',22,21)]:
              if not verse(*ref): raise SystemExit('KJV regression check failed: %s %s:%s'%ref)
          print(f'KJV VERIFIED: {len(books)} books, {chapters} chapters, {verses} verses')
          print('Jeremiah 29:11, John 5:24, Romans 8:28 and Revelation 22:21 verified')
          PY
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename Beta APK
        run: cp app/build/outputs/apk/debug/app-debug.apk KingZulu-Beta1.apk
      - name: Upload Beta APK
        uses: actions/upload-artifact@v4
        with:
          name: KingZulu-Beta1
          path: KingZulu-Beta1.apk
          if-no-files-found: error
