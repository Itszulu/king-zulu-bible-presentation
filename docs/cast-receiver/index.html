<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>King Zulu Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;color:#fff;font-family:Arial,Helvetica,sans-serif}
    #bg,#shade,#stage{position:fixed;inset:0}
    #bg{background:#000 center/cover no-repeat}
    #shade{background:rgba(0,0,0,.38)}
    #stage{box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 6vw}
    #reference{font-size:3vw;font-weight:800;color:#b9adff;margin-bottom:2vh}
    #text{font-size:4.6vw;font-weight:700;line-height:1.14;white-space:pre-wrap;max-width:92vw;max-height:72vh}
    #translation{font-size:1.8vw;font-weight:700;margin-top:2vh;color:#ddd}
    #ready{font-size:2vw;color:#777;font-weight:700;letter-spacing:.08em}
    #videoBg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;display:none}
  </style>
</head>
<body>
  <video id="videoBg" muted loop playsinline></video>
  <div id="bg"></div><div id="shade"></div>
  <main id="stage"><div id="ready">KING ZULU</div><div id="reference"></div><div id="text"></div><div id="translation"></div></main>
<script>
(() => {
  'use strict';
  const NS='urn:x-cast:com.kingzulu.presentation';
  const context=cast.framework.CastReceiverContext.getInstance();
  const stage=document.getElementById('stage'), ref=document.getElementById('reference'), text=document.getElementById('text'), tr=document.getElementById('translation'), ready=document.getElementById('ready'), bg=document.getElementById('bg'), shade=document.getElementById('shade'), video=document.getElementById('videoBg');
  const escUrl=v=>typeof v==='string' && /^https:\/\//i.test(v) ? v : '';
  function fit(size,auto){let px=Math.max(18,Number(size)||46);text.style.fontSize=px+'px';if(!auto)return;const min=Math.max(18,innerHeight*.026);while(px>min && (text.scrollHeight>innerHeight*.70 || text.scrollWidth>innerWidth*.91)){px-=1;text.style.fontSize=px+'px'}}
  function render(s){
    if(!s||s.black){stage.style.display='none';video.style.display='none';bg.style.backgroundImage='none';shade.style.background='#000';return}
    stage.style.display='flex';ready.style.display=(s.text||s.reference)?'none':'block';ref.textContent=s.reference||'';text.textContent=s.text||'';tr.textContent=s.translation||'';
    const image=escUrl(s.backgroundUrl), motion=escUrl(s.backgroundVideoUrl);
    if(motion){video.src=motion;video.style.display='block';video.play().catch(()=>{});bg.style.backgroundImage='none'}else{video.pause();video.removeAttribute('src');video.style.display='none';bg.style.backgroundImage=image?`url("${image.replace(/"/g,'%22')}")`:'none'}
    shade.style.background=`rgba(0,0,0,${Math.min(.9,Math.max(0,Number(s.overlay)||.38))})`;
    fit(s.textSize,s.autoFit!==false);
  }
  context.addCustomMessageListener(NS,event=>{try{const data=typeof event.data==='string'?JSON.parse(event.data):event.data;if(data&&data.type==='presentation_state')render(data)}catch(e){console.error('King Zulu message error',e)}});
  window.addEventListener('resize',()=>fit(parseFloat(text.style.fontSize)||46,true));
  context.start({disableIdleTimeout:true});
})();
</script>
</body>
</html>
